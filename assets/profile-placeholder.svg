<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">Profile Placeholder</title>
  <desc id="desc">Simple abstract placeholder portrait block to be replaced by real photo.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f7a6b" />
      <stop offset="100%" stop-color="#b5692f" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="760" rx="24" fill="#f4f1e9" />
  <circle cx="320" cy="260" r="120" fill="url(#g)" opacity="0.85" />
  <rect x="130" y="420" width="380" height="190" rx="26" fill="url(#g)" opacity="0.9" />
  <text x="320" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#455a4f">
    Replace with your photo
  </text>
</svg>
